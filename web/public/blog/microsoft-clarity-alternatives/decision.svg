<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<rect width="900" height="520" rx="16" fill="#f8fafc"/>
<text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Which replay tool fits? A quick decision path</text>
<g fill="#ffffff" stroke="#334155" stroke-width="2">
<rect x="300" y="60" width="300" height="56" rx="10"/>
<rect x="60" y="170" width="300" height="64" rx="10"/>
<rect x="540" y="170" width="300" height="64" rx="10"/>
</g>
<g font-size="15" fill="#0f172a" text-anchor="middle">
<text x="450" y="94">Need session replay and heatmaps?</text>
<text x="210" y="198">Can data be processed by a US-based</text><text x="210" y="218">vendor, with 30-day replay retention?</text>
<text x="690" y="198">Must data stay on your own servers</text><text x="690" y="218">(self-hosting)?</text>
</g>
<g stroke="#334155" stroke-width="2" fill="none"><path d="M400 116 L210 170"/><path d="M500 116 L690 170"/></g>
<g font-size="13" fill="#475569" text-anchor="middle"><text x="170" y="140">Free is the priority</text><text x="730" y="140">Control is the priority</text></g>
<g stroke="#334155" stroke-width="2" fill="none"><path d="M120 234 L120 300"/><path d="M300 234 L300 300"/><path d="M600 234 L600 300"/><path d="M780 234 L780 300"/></g>
<g font-size="13" fill="#475569" text-anchor="middle"><text x="140" y="270" text-anchor="start">Yes</text><text x="320" y="270" text-anchor="start">No</text><text x="610" y="270" text-anchor="start">Replay only</text><text x="790" y="270" text-anchor="start">All-in-one</text></g>
<rect x="30" y="300" width="180" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<rect x="215" y="300" width="170" height="80" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<rect x="515" y="300" width="170" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<rect x="700" y="300" width="190" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<g font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
<text x="120" y="334">Microsoft Clarity</text><text x="300" y="334">Hotjar or Mouseflow</text><text x="600" y="334">OpenReplay</text><text x="795" y="334">Seentics or PostHog</text></g>
<g font-size="12.5" fill="#334155" text-anchor="middle">
<text x="120" y="356">Free, no traffic limits</text><text x="300" y="356">(paid, hosted)</text><text x="600" y="356">Self-hosted replay</text><text x="795" y="356">Open source, self-hostable</text></g>
<rect x="60" y="420" width="780" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="450" y="450" text-anchor="middle" font-size="14" fill="#0f172a">Still want Clarity's free replays? Pair it with a cookieless analytics tool</text>
<text x="450" y="472" text-anchor="middle" font-size="14" fill="#0f172a">for counting, and load Clarity only where you have consent.</text>
</svg>
