<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="800" height="420" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Illustrative checkout funnel</text>
  <text x="400" y="58" text-anchor="middle" font-size="12" fill="#475569">Numbers are made up to show how to read a funnel, not real data</text>
  <!-- bars centered at x=300, max width 440 -->
  <rect x="80" y="80" width="440" height="42" rx="6" fill="#0ea5e9"/>
  <text x="300" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Product page: 100%</text>
  <rect x="136" y="136" width="328" height="42" rx="6" fill="#0284c7"/>
  <text x="300" y="163" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Add to cart: 25%</text>
  <rect x="186" y="192" width="228" height="42" rx="6" fill="#0369a1"/>
  <text x="300" y="219" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Begin checkout: 12%</text>
  <rect x="222" y="248" width="156" height="42" rx="6" fill="#075985"/>
  <text x="300" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Payment: 8%</text>
  <rect x="250" y="304" width="100" height="42" rx="6" fill="#0c4a6e"/>
  <text x="300" y="331" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Order: 4%</text>
  <!-- drop-off labels -->
  <g font-size="13" fill="#b91c1c" font-weight="600">
    <text x="560" y="134">-75% lost</text>
    <text x="560" y="190">-52% lost of those</text>
    <text x="560" y="246">-33% lost of those</text>
    <text x="560" y="302">-50% lost of those</text>
  </g>
  <g stroke="#b91c1c" stroke-width="1.5" fill="none">
    <path d="M530 129 L548 129"/><path d="M530 185 L548 185"/><path d="M530 241 L548 241"/><path d="M530 297 L548 297"/>
  </g>
  <text x="400" y="385" text-anchor="middle" font-size="13" fill="#334155">Step conversion = visitors at this step / visitors at the previous step</text>
  <text x="400" y="404" text-anchor="middle" font-size="13" fill="#334155">Overall conversion = visitors at the last step / visitors at the first step</text>
</svg>
