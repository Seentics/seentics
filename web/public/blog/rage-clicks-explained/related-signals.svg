<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="900" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Four frustration signals at a glance</text>
<g text-anchor="middle" fill="#0f172a">
<rect x="25" y="65" width="205" height="205" rx="12" fill="#fee2e2" stroke="#dc2626"/>
<text x="127" y="95" font-size="17" font-weight="700">Rage click</text>
<g font-size="13"><text x="127" y="125">Many fast clicks in</text><text x="127" y="145">one small area</text><text x="127" y="185" font-weight="700">Means:</text><text x="127" y="205">"Why won't this work?"</text></g>
<rect x="245" y="65" width="205" height="205" rx="12" fill="#fef3c7" stroke="#d97706"/>
<text x="347" y="95" font-size="17" font-weight="700">Dead click</text>
<g font-size="13"><text x="347" y="125">Click with no visible</text><text x="347" y="145">response or navigation</text><text x="347" y="185" font-weight="700">Means:</text><text x="347" y="205">"Is this even a button?"</text></g>
<rect x="465" y="65" width="205" height="205" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
<text x="567" y="95" font-size="17" font-weight="700">U-turn (quick back)</text>
<g font-size="13"><text x="567" y="125">Arrive on a page and</text><text x="567" y="145">go straight back</text><text x="567" y="185" font-weight="700">Means:</text><text x="567" y="205">"This isn't what I wanted"</text></g>
<rect x="685" y="65" width="190" height="205" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
<text x="780" y="95" font-size="17" font-weight="700">Excessive scroll</text>
<g font-size="13"><text x="780" y="125">Far more scrolling</text><text x="780" y="145">than is typical</text><text x="780" y="185" font-weight="700">Means:</text><text x="780" y="205">"I can't find it"</text></g>
</g>
</svg>
