services:
  # ---------------------------------------------------------------------------
  # Single OSS API — Bun + Hono + Drizzle (auth, websites, analytics, funnels,
  # automations, tracker, session replay, heatmaps). Run `bun run db:push` in
  # ./core once against an empty Postgres (or migrate from a legacy schema).
  # Optional: ./data/maxmind/GeoLite2-City.mmdb for analytics country/region/city (see seentics/README).
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./core
      dockerfile: Dockerfile.dev
    container_name: seentics-api
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - ENVIRONMENT=development
      - DATABASE_URL=postgres://seentics:seentics_pass@seentics-postgres:5432/seentics_analytics?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key--must-be-32-characters}
      - GLOBAL_API_KEY=${GLOBAL_API_KEY:-dev-global-api-key}
      - S3_ENDPOINT=http://objex:9000
      # Presigned replay/heatmap URLs must use a host the browser can open (not Docker-only `objex`).
      - S3_PUBLIC_ENDPOINT=http://localhost:9000
      - S3_BUCKET_REPLAYS=seentics-replays
      - AWS_REGION=auto
      - AWS_ACCESS_KEY_ID=seentics-dev
      - AWS_SECRET_ACCESS_KEY=seentics-dev-secret
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4000,http://127.0.0.1:4000}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - MAXMIND_DB_PATH=${MAXMIND_DB_PATH:-/app/db/maxmind/GeoLite2-City.mmdb}
      - MAXMIND_GEO_CACHE_MAX=${MAXMIND_GEO_CACHE_MAX:-50000}
      # Optional ISO2 when ingest only sees private IPs (localhost/Docker). Example: BD. Leave unset for no fallback.
      - GEO_FALLBACK_COUNTRY=${GEO_FALLBACK_COUNTRY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
      objex-init:
        condition: service_completed_successfully
    volumes:
      - ./core:/app
      - /app/node_modules
    networks:
      - seentics-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "-O-", "http://localhost:8001/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  postgres:
    # Postgres 16 + the `hll` extension, so the dashboard's analytics rollups are on by
    # default (without it core falls back to slower raw-event queries).
    #
    # New volume name (v4): the previous v3 volume was created by postgres:15-alpine and
    # Postgres 16 cannot open it. v3 is left in place, not deleted — dump and restore it
    # into this one if you need that data.
    build:
      context: ./deploy/postgres
    image: seentics-postgres:16-hll
    container_name: seentics-postgres
    environment:
      - POSTGRES_USER=seentics
      - POSTGRES_PASSWORD=seentics_pass
      - POSTGRES_DB=seentics_analytics
    volumes:
      - seentics-db-v4:/var/lib/postgresql/data
    networks:
      - seentics-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U seentics -d seentics_analytics" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # objex: lightweight S3-compatible object storage for replay chunks and
  # heatmap snapshots (github.com/kajdesk/objex). The image carries its own
  # healthcheck. Dev-only key.
  objex:
    image: ghcr.io/kajdesk/objex:0.2.0
    container_name: seentics-objex
    ports:
      - "9000:9000" # S3 API (presigned URLs point here)
    environment:
      - OBJEX_ACCESS_KEY=seentics-dev
      - OBJEX_SECRET_KEY=seentics-dev-secret
      - OBJEX_REGION=auto
    volumes:
      - seentics-objex:/data
    networks:
      - seentics-network
    restart: unless-stopped
    stop_grace_period: 30s

  # One-shot: create the bucket and its CORS rule. Idempotent.
  objex-init:
    image: amazon/aws-cli:2.27.0
    entrypoint: ["sh", "/create-buckets.sh"]
    environment:
      - AWS_ACCESS_KEY_ID=seentics-dev
      - AWS_SECRET_ACCESS_KEY=seentics-dev-secret
      - BUCKETS=seentics-replays
    volumes:
      - ./deploy/objex/create-buckets.sh:/create-buckets.sh:ro
    depends_on:
      objex:
        condition: service_healthy
    networks:
      - seentics-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: seentics-web
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api/v1
      - API_GATEWAY_URL=http://api:8001
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      api:
        condition: service_healthy
    networks:
      - seentics-network
    restart: unless-stopped

volumes:
  seentics-db-v4:
  seentics-objex:

networks:
  seentics-network:
    name: seentics-network
    driver: bridge
