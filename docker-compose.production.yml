# Production-only stack. Copy deploy/production.env.example to a secure location,
# replace every value, then run:
# docker compose --env-file /secure/path/seentics.production.env -f docker-compose.production.yml up -d --build
#
# The API, Postgres, and objex are deliberately not published to the host. Caddy is
# the only public entry point (80/443); dashboard API calls are same-origin through
# Next.js rewrites. Set the image variables to immutable tags or digests before use.
services:
  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a pinned Caddy image or digest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?Set STORAGE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      objex:
        condition: service_healthy
    networks: [public, private]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_GATEWAY_URL: http://api:8001
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_IS_ENTERPRISE: ${NEXT_PUBLIC_IS_ENTERPRISE:-false}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_GATEWAY_URL: http://api:8001
    expose: ["4000"]
    depends_on:
      api:
        condition: service_healthy
    networks: [private]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/signin').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./core
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8001"
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      GLOBAL_API_KEY: ${GLOBAL_API_KEY:?Set GLOBAL_API_KEY}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      TRUST_PROXY: "true"
      RATE_LIMIT_ENABLED: "true"
      ANALYTICS_CACHE_ENABLED: "true"
      LOG_LEVEL: info
      S3_ENDPOINT: http://objex:9000
      S3_PUBLIC_ENDPOINT: https://${STORAGE_DOMAIN:?Set STORAGE_DOMAIN}
      S3_BUCKET_REPLAYS: ${S3_BUCKET_REPLAYS:-seentics-replays}
      AWS_REGION: auto
      AWS_ACCESS_KEY_ID: ${OBJEX_ACCESS_KEY:?Set OBJEX_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${OBJEX_SECRET_KEY:?Set OBJEX_SECRET_KEY}
      DATA_RETENTION_ENABLED: "true"
    expose: ["8001"]
    depends_on:
      postgres:
        condition: service_healthy
      objex-init:
        condition: service_completed_successfully
    networks: [private]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a pinned PostgreSQL image or digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [private]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8

  objex:
    image: ${OBJEX_IMAGE:?Set OBJEX_IMAGE to a pinned objex image or digest}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      OBJEX_ACCESS_KEY: ${OBJEX_ACCESS_KEY:?Set OBJEX_ACCESS_KEY}
      OBJEX_SECRET_KEY: ${OBJEX_SECRET_KEY:?Set OBJEX_SECRET_KEY}
      OBJEX_REGION: auto
    volumes: [objex-data:/data]
    networks: [private]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/usr/local/bin/objex", "health", "http://127.0.0.1:9000/_objex/health"]
      interval: 10s
      timeout: 5s
      retries: 8

  objex-init:
    image: ${AWS_CLI_IMAGE:?Set AWS_CLI_IMAGE to a pinned amazon/aws-cli image or digest}
    restart: "no"
    entrypoint: ["sh", "/create-buckets.sh"]
    depends_on:
      objex:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${OBJEX_ACCESS_KEY:?Set OBJEX_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${OBJEX_SECRET_KEY:?Set OBJEX_SECRET_KEY}
      BUCKETS: ${S3_BUCKET_REPLAYS:-seentics-replays}
      CORS_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
    volumes:
      - ./deploy/objex/create-buckets.sh:/create-buckets.sh:ro
    networks: [private]
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  objex-data:
  caddy-data:
  caddy-config:

networks:
  public:
  private:
    internal: true
